name: Deploy prod

# Dispara em push em main (depois do merge manual da PR develop -> main aberta por
# deploy-dev.yml). Builda a própria imagem a partir do commit de main — mais simples,
# mesmo padrão do deploy-dev.yml.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "Dockerfile"
      - "terraform/environments/**"
      - "terraform/modules/**"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency: deploy-prod

env:
  REGION: us-central1
  AR: us-central1-docker.pkg.dev/portfolio-analytics-fuzati/apps

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: prod-deploy
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_APPLY }}
          service_account: ${{ secrets.WIF_SA_APPLY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve

  apps-deploy:
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: prod-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_APPLY }}
          service_account: ${{ secrets.WIF_SA_APPLY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: build & push
        run: |
          IMG="${AR}/portfolio-analytics:${GITHUB_SHA::12}"
          docker build -t "$IMG" .
          docker push "$IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: deploy prod
        run: |
          gcloud run deploy portfolio-analytics-prod \
            --region "$REGION" --image "$IMG" --quiet
